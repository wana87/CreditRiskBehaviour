- input: [ payment.period, payment.days_past_due, payment.observation_status, report.analysis_period ]
  output: months_since_last_delinquency
  default-value: <NaN>
  complex-params: true
  encoding:
    type: expression-encoding
    expression: |
      periods  = in.$1
      dpds     = in.$2
      statuses = in.$3
      analysis = in.$4
      ap_year  = tonumber(string.sub(analysis, 1, 4))
      ap_month = tonumber(string.sub(analysis, 6, 7))
      ap_ym    = ap_year * 12 + (ap_month - 1)
      win_start = ap_ym - 23
      last_delinq_ym = nil
      if periods ~= nil then
        for i = 1, #periods do
          p  = periods[i]
          st = statuses[i]
          if st == "REPORTED" and p ~= nil then
            dpd = dpds[i]
            if dpd == nil then dpd = 0 end
            p_year  = tonumber(string.sub(p, 1, 4))
            p_month = tonumber(string.sub(p, 6, 7))
            p_ym    = p_year * 12 + (p_month - 1)
            if p_ym >= win_start and p_ym <= ap_ym then
              if dpd > 0 then
                if last_delinq_ym == nil or p_ym > last_delinq_ym then
                  last_delinq_ym = p_ym
                end
              end
            end
          end
        end
      end
      if last_delinq_ym == nil then
        out.$1 = nil
      else
        out.$1 = ap_ym - last_delinq_ym
      end
# ---------------------------------------------------------------------------
# DERIVED RATE FEATURES
# ---------------------------------------------------------------------------
- input: [ delinquent_slot_count_12m, reported_slot_count_12m ]
  output: delinquency_rate_12m
  default-value: <NaN>
  encoding:
    type: expression-encoding
    expression: |
      denom = in.$2
      if denom == nil or denom == 0 then
        out.$1 = nil
      else
        out.$1 = in.$1 / denom
      end
